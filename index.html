<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCC02.de - Occult Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #030305;
            color: #d1d5db;
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(153, 27, 27, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 40%);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #030305;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f1912;
            border: 1px solid #d4af37;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #991b1b;
        }

        /* Mystical Glowing Effects */
        .occult-glow {
            text-shadow: 0 0 12px rgba(153, 27, 27, 0.9), 0 0 30px rgba(212, 175, 55, 0.6), 0 0 50px rgba(153, 27, 27, 0.4);
        }
        .seal-glow {
            box-shadow: 0 0 50px rgba(153, 27, 27, 0.9), 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 35px rgba(212, 175, 55, 0.5);
        }

        /* Slow rotating rune circle background */
        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotate-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        .spin-slow {
            animation: rotate-slow 90s linear infinite;
        }
        .spin-reverse {
            animation: rotate-reverse 120s linear infinite;
        }

        /* Gate animations & styles */
        #gate-overlay {
            perspective: 2000px;
            transition: opacity 1.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.6s ease-in-out;
        }
        .gate-door-left, .gate-door-right {
            transition: transform 2.8s cubic-bezier(0.77, 0, 0.175, 1);
            background: 
                linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(20,15,22,0.95) 50%, rgba(5,3,6,0.9) 100%),
                radial-gradient(circle at center, #18111a 0%, #080509 75%, #020103 100%);
            border: 10px solid #140f0c;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.98), 0 0 60px rgba(0,0,0,0.95);
        }
        .gate-door-left {
            transform-origin: left center;
        }
        .gate-door-right {
            transform-origin: right center;
        }
        .gate-open .gate-door-left {
            transform: rotateY(-118deg);
        }
        .gate-open .gate-door-right {
            transform: rotateY(118deg);
        }
        .gate-open {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Torch Flame Flicker animation */
        @keyframes flicker {
            0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 15px rgba(212,175,55,0.8)); transform: scale(1); }
            25% { opacity: 0.95; filter: drop-shadow(0 0 30px rgba(185,28,28,0.95)); transform: scale(1.05); }
            50% { opacity: 0.65; filter: drop-shadow(0 0 10px rgba(212,175,55,0.5)); transform: scale(0.97); }
            75% { opacity: 1; filter: drop-shadow(0 0 35px rgba(212,175,55,1)); transform: scale(1.08); }
        }
        .flicker {
            animation: flicker 3.2s infinite ease-in-out;
        }

        /* Whispering Text Glow */
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
            50% { text-shadow: 0 0 28px rgba(185, 28, 28, 0.9), 0 0 40px rgba(212, 175, 55, 0.7); }
        }
        .whisper-glow {
            animation: pulse-glow 4.5s infinite ease-in-out;
        }

        /* Parchment link for Hints */
        .parchment-link {
            background: linear-gradient(135deg, #1c150c 0%, #2a1f12 50%, #150f08 100%);
            color: #d4af37;
            border: 1px solid #785a22;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.15);
            transition: all 0.4s ease;
        }
        .parchment-link:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 25px rgba(153, 27, 27, 0.4), 0 0 25px rgba(212, 175, 55, 0.4);
            border-color: #d4af37;
            color: #fff;
        }

        /* Gothic Pillars Frame */
        .gothic-pillar {
            background: linear-gradient(180deg, #1a1512 0%, #0d0a08 50%, #050403 100%);
            border-color: #2e2217;
            box-shadow: inset 0 0 30px #000, 0 0 30px rgba(0,0,0,0.9);
        }
    </style>
</head>
